<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLD MASTER | Luxury Real Estate Dubai</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- خط القاهرة العصري وخط أرقام فخم -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #070d18;
            --bg-card: #0d1726;
            --bg-card-hover: #132238;
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa771c 100%);
            --gold-primary: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.25);
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(212, 175, 55, 0.2);
            --danger-gradient: linear-gradient(135deg, #ef4444, #991b1b);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* نافبار فخم */
        nav {
            background: rgba(7, 13, 24, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
            padding: 1.2rem 3rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            flex-direction: column;
        }

        .brand h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.8rem;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .brand span {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-link {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--gold-primary);
        }

        .btn-gold {
            background: var(--gold-gradient);
            color: #070d18;
            font-weight: 800;
            padding: 0.6rem 1.6rem;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--gold-glow);
            transition: all 0.3s ease;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.45);
        }

        .btn-danger {
            background: var(--danger-gradient);
            color: white;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.3s;
        }

        .btn-danger:hover {
            opacity: 0.85;
        }

        /* الصفحات المتعددة (SPA Views) */
        .page-view {
            display: none;
            min-height: 80vh;
            padding: 2.5rem 1.5rem;
            max-width: 1250px;
            margin: auto;
        }

        .page-view.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* الهيرو سكشن */
        .hero {
            text-align: center;
            padding: 3.5rem 1rem 4rem;
            background: radial-gradient(circle at center, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
        }

        .hero h2 {
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.15rem;
            max-width: 650px;
            margin: auto;
        }

        /* كروت العقارات */
        .properties-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 30px;
            margin-top: 2rem;
        }

        .prop-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
            position: relative;
        }

        .prop-card:hover {
            transform: translateY(-6px);
            background: var(--bg-card-hover);
            border-color: var(--gold-primary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .prop-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 1px solid var(--border-color);
        }

        .prop-body {
            padding: 1.5rem;
        }

        .prop-badge {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid var(--border-color);
            display: inline-block;
            margin-bottom: 10px;
        }

        .prop-price {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 8px;
        }

        .prop-price small {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: 'Cairo', sans-serif;
        }

        .prop-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #e2e8f0;
        }

        .prop-location {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.2rem;
        }

        .prop-specs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.08);
            text-align: center;
        }

        .spec-item {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .spec-item b {
            display: block;
            color: var(--gold-primary);
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
        }

        /* صفحة صاحب الشركة (About Chairman) */
        .chairman-wrapper {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 3rem 2rem;
            max-width: 900px;
            margin: 2rem auto;
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .chairman-avatar-box {
            flex: 1;
            min-width: 260px;
            text-align: center;
        }

            width
