    <style>
        :root {
            --bg-main: #050507;
            --bg-card: #0d0d12;
            --bg-card-hover: #14141c;
            --gold-gradient: linear-gradient(135deg, #f0d78c 0%, #d4af37 50%, #996515 100%);
            --gold: #d4af37;
            --gold-light: #fae19c;
            --gold-glow: rgba(212, 175, 55, 0.35);
            --border-gold: rgba(212, 175, 55, 0.3);
            --text: #ffffff;
            --text-dim: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* نافبار الموقع */
        nav {
            background: rgba(5, 5, 7, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-gold);
            padding: 1.2rem 2.5rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.8rem;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .brand span {
            font-size: 0.75rem;
            color: var(--gold-light);
            letter-spacing: 1.5px;
            display: block;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-link {
            color: #d1d5db;
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--gold);
        }

        /* الأزرار الذهبية المضيئة عند الضغط */
        .btn-gold {
            background: var(--gold-gradient);
            color: #050507;
            font-weight: 800;
            padding: 0.65rem 1.8rem;
            border-radius: 30px;
            border: 1px solid var(--gold-light);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px var(--gold-glow);
            transition: all 0.25s ease;
            outline: none;
        }
